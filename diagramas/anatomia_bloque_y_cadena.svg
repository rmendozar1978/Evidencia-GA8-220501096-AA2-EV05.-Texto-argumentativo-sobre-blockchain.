  <text x="60" y="505" fill="#38bdf8" font-size="13" font-weight="bold">🛡️ PRINCIPIO MATEMÁTICO DE INMUTABILIDAD (EFECTO AVALANCHA DE HASH):</text>
  <text x="60" y="525" fill="#f1f5f9" font-size="11.5">Si un atacante modifica maliciosamente un solo carácter en las transacciones del <tspan fill="#fbbf24" font-weight="bold">Bloque 1</tspan>, su Hash cambia radicalmente.</text>
  <text x="60" y="542" fill="#fca5a5" font-size="11.5">Como el <tspan fill="#34d399" font-weight="bold">Bloque 2</tspan> almacena el Hash anterior exacto, la discrepancia invalida automáticamente toda la cadena subsiguiente ante los demás nodos de la red P2P.</text>
